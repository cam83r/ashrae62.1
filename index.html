<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ventilation 62.1 – Prédimensionnement</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Ventilation ASHRAE 62.1 <span>— prédimensionnement de l'air neuf</span></h1>
      <p class="edition" id="edition"></p>
    </div>
    <div class="scenario-bar">
      <label for="scenarioSelect">Scénario</label>
      <select id="scenarioSelect"></select>
      <button type="button" data-action="sc-new" title="Nouveau scénario vide">Nouveau</button>
      <button type="button" data-action="sc-dup" title="Dupliquer le scénario actif (comparaison)">Dupliquer</button>
      <button type="button" data-action="sc-rename">Renommer</button>
      <button type="button" data-action="sc-del" class="danger">Supprimer</button>
    </div>
    <div class="file-bar">
      <button type="button" data-action="export-csv" class="primary">Exporter CSV</button>
      <button type="button" data-action="export-json">Enregistrer projet (.json)</button>
      <label class="button">Ouvrir projet<input type="file" id="importJson" accept=".json,application/json" hidden></label>
      <button type="button" data-action="load-sample" title="Recharger les 3 scénarios de l'onglet « Calcul Ville »">Exemple Excel</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="dashboard">Tableau de bord</button>
    <button type="button" role="tab" data-tab="locaux">Locaux</button>
    <button type="button" role="tab" data-tab="systemes">Systèmes</button>
    <button type="button" role="tab" data-tab="params">Paramètres</button>
    <button type="button" role="tab" data-tab="table">Norme 62.1</button>
    <button type="button" role="tab" data-tab="compare">Comparaison</button>
    <button type="button" role="tab" data-tab="validation">Validation Excel</button>
  </nav>

  <main id="view"></main>

  <div class="modal" id="picker" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
      <div class="modal-head">
        <h2 id="pickerTitle">Catégorie d'occupation — Tableau 6.2.2.1</h2>
        <button type="button" class="close" data-action="picker-close" aria-label="Fermer">×</button>
      </div>
      <input type="search" id="pickerSearch" placeholder="Rechercher (français ou anglais)…" autocomplete="off">
      <div class="modal-body" id="pickerList"></div>
    </div>
  </div>

  <div class="modal" id="dialog" hidden>
    <div class="modal-box dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
      <div class="modal-head"><h2 id="dlgTitle"></h2></div>
      <div class="dlg-body" id="dlgBody"></div>
      <div class="dlg-actions" id="dlgActions"></div>
    </div>
  </div>

  <footer class="foot">
    Calculs côté client, reproduits de l'onglet « Calcul Ville » de <em>D-449.1_Aide_decision_UCT_CRCL_v2.xlsx</em>.
    Outil de prédimensionnement : ne remplace pas le calcul signé du professionnel.
  </footer>

  <script src="js/table621.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
